<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>NCU Wavefront Gas Measurement</title>



  <!-- A-Frame -->

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR -->

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

 
  <style>

    body {

      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    #info {

      position: fixed;

      top: 20px;

      left: 0;

      width: 100%;

      text-align: center;

      color: white;

      font-family: Arial, sans-serif;

      font-size: 18px;

      z-index: 10;

      text-shadow: 0 1px 4px #000;

      pointer-events: none;
    }
/* 防止相機畫面閃爍與層級錯亂 */
    video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: -1 !important;
    }
  </style>
 <!-- 中文字體動態繪製組件 -->
  <script>
    AFRAME.registerComponent('chinese-text', {
      schema: {
        text: {type: 'string', default: ''},
        color: {type: 'string', default: '#ffffff'},
        size: {type: 'number', default: 50}
      },
      init: function () {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = `Bold ${this.data.size}px "Microsoft JhengHei", "PingFang TC", sans-serif`;
        ctx.fillStyle = this.data.color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.data.text, canvas.width / 2, canvas.height / 2);

        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        
        const material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          side: THREE.DoubleSide,
          depthTest: true,
          depthWrite: false
        });

        // 獨立建立 Plane Geometry 避免閃爍與貼圖遺失
        const geometry = new THREE.PlaneGeometry(1.8, 0.45);
        const mesh = new THREE.Mesh(geometry, material);
        this.el.setObject3D('mesh', mesh);
      }
    });
  </script>  
</head>
<body>

  <div id="info">

    please Scan the Figure on card

  </div>



  <a-scene

   mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: true;

    uiLoading: yes;
    uiScanning: yes;
    uiError: yes;
  "
  embedded

    color-space="sRGB"

    renderer="colorManagement: true, physicallyCorrectLights"

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >

    <!-- Camera -->

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>



    <!-- AR content -->

    <a-entity mindar-image-target="targetIndex: 0">

  

  <!-- 5. 說明文字：主標題 -->
  <a-text
    value="GAS Sensor"
    position="0 0.55 0.30"
    align="center"
    color="#ffffff"
    width="2.8"
    animation="
      property: position;
      from: 0 0.45 0.30;
      to: 0 0.55 0.30;
      dur: 900;
      easing: easeOutQuad
    "
  >
  </a-text>

  <!-- 8. 副標題 -->
 <a-entity
    position="0 -0.20 0.1"
    chinese-text="text: 即時量測 | 非破壞性 | 無需分光儀; color: #66ffcc; size: 44;" 
  >
  </a-entity>
      
  </a-entity>

  </a-scene>

</body>

</html>
