<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>NCU Wavefront Gas Measurement</title>



  <!-- A-Frame -->

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR -->

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

 
  <style>

    body {

      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    #info {

      position: fixed;

      top: 20px;

      left: 0;

      width: 100%;

      text-align: center;

      color: white;

      font-family: Arial, sans-serif;

      font-size: 18px;

      z-index: 10;

      text-shadow: 0 1px 4px #000;

      pointer-events: none;

    }
    /* 強制將 WebGL 3D 渲染層設定在相機畫面上方 */
    .a-canvas {
      z-index: 2 !important;
    }

  </style>
<!-- 自動動態產生中文貼圖的腳本 -->
  <script>
    AFRAME.registerComponent('chinese-text', {
      schema: {
        text: {type: 'string', default: ''},
        color: {type: 'string', default: '#ffffff'},
        size: {type: 'number', default: 48}
      },
      init: function () {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = `Bold ${this.data.size}px "Microsoft JhengHei", "PingFang TC", sans-serif`;
        ctx.fillStyle = this.data.color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.data.text, canvas.width / 2, canvas.height / 2);

        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          side: THREE.DoubleSide
        });
        
        const mesh = this.el.getObject3D('mesh');
        if (mesh) {
          mesh.material = material;
        }
      }
    });
  </script>  
</head>



<body>

  <div id="info">

    Scan the card to see novelty

  </div>



  <a-scene

    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.0001; filterBeta: 0.001;"
    embedded

    color-space="sRGB"

    renderer="colorManagement: true, physicallyCorrectLights"

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >

    <!-- Camera -->

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>



    <!-- AR content -->

    <a-entity mindar-image-target="targetIndex: 0">

  

  <!-- 5. 說明文字：主標題 -->
  <a-text
    value="GAS Sensor"
    position="0 0.55 0.30"
    align="center"
    color="#ffffff"
    width="2.8"
    animation="
      property: position;
      from: 0 0.45 0.30;
      to: 0 0.55 0.30;
      dur: 900;
      easing: easeOutQuad
    "
  >
  </a-text>

  <!-- 8. 副標題 -->
 <a-troika-text
    value="即時量測  |  非破壞性  |  無需分光儀"
    position="0 -0.20 0.25"
    width="1.8"
    height="0.45"
    material="transparent: true; opacity: 0;"
    chinese-text="text: 即時量測 | 非破壞性 | 無需分光儀; color: #66ffcc; size: 40;" 
  >
  </a-troika-text>
      
    </a-entity>

  </a-scene>

</body>

</html>
