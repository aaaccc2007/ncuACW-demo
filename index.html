<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>NCU Wavefront Gas Measurement</title>



  <!-- A-Frame -->

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>



  <!-- MindAR -->

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>



  <style>

    body {

      margin: 0;

      overflow: hidden;

    }

    #info {

      position: fixed;

      top: 20px;

      left: 0;

      width: 100%;

      text-align: center;

      color: white;

      font-family: Arial, sans-serif;

      font-size: 18px;

      z-index: 10;

      text-shadow: 0 1px 4px #000;

      pointer-events: none;

    }

  </style>

</head>



<body>

  <div id="info">

    Scan the card to see our technology

  </div>



  <a-scene

    mindar-image="imageTargetSrc: ./targets.mind;"

    embedded

    color-space="sRGB"

    renderer="colorManagement: true, physicallyCorrectLights"

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >

    <!-- Camera -->

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>



    <!-- AR content -->

    <a-entity mindar-image-target="targetIndex: 0">



      <!-- Laser beam -->

      <a-cylinder

        position="-0.15 0.15 0.15"

        rotation="0 0 90"

        radius="0.025"

        height="0.75"

        color="#00ff66"

        opacity="0.9"

        animation__pulse="

          property: opacity;

          from: 0.3;

          to: 1;

          dur: 700;

          loop: true;

          dir: alternate

        "

      >

      </a-cylinder>



      <!-- Gas chamber -->

      <a-box

        position="0.25 0.15 0.12"

        width="0.35"

        height="0.30"

        depth="0.06"

        color="#66ccff"

        opacity="0.35"

      >

      </a-box>



      <!-- Gas label -->

      <a-text

        value="GAS"

        position="0.25 0.15 0.18"

        align="center"

        color="white"

        width="1.5"

      >

      </a-text>



      <!-- Wavefront sensor -->

      <a-ring

        position="0.65 0.15 0.16"

        radius-inner="0.08"

        radius-outer="0.12"

        color="#00ff66"

        animation="

          property: rotation;

          to: 0 0 360;

          dur: 1800;

          loop: true;

          easing: linear

        "

      >

      </a-ring>



      <a-text

        value="WAVEFRONT"

        position="0.65 -0.02 0.18"

        align="center"

        color="white"

        width="1.5"

      >

      </a-text>



      <!-- Main message -->

      <a-text

        value="SEE GAS WITH LIGHT"

        position="0 0.55 0.20"

        align="center"

        color="#ffffff"

        width="2.8"

        animation="

          property: position;

          from: 0 0.45 0.20;

          to: 0 0.55 0.20;

          dur: 900;

          easing: easeOutQuad

        "

      >

      </a-text>



      <!-- Subtitle -->

      <a-text

        value="Real-time  |  Non-invasive  |  No Spectrometer"

        position="0 -0.50 0.20"

        align="center"

        color="#66ffcc"

        width="1.8"

      >

      </a-text>



    </a-entity>

  </a-scene>

</body>

</html>
