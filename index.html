<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>NCU Wavefront Gas Measurement</title>



  <!-- A-Frame -->

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR -->

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>



  <style>

    body {

      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    #info {

      position: fixed;

      top: 20px;

      left: 0;

      width: 100%;

      text-align: center;

      color: white;

      font-family: Arial, sans-serif;

      font-size: 18px;

      z-index: 10;

      text-shadow: 0 1px 4px #000;

      pointer-events: none;

    }
    /* 強制將 WebGL 3D 渲染層設定在相機畫面上方 */
    .a-canvas {
      z-index: 2 !important;
    }

  </style>

</head>



<body>

  <div id="info">

    Scan the card to see our technology

  </div>



  <a-scene

    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.0001; filterBeta: 0.001;"
    embedded

    color-space="sRGB"

    renderer="colorManagement: true, physicallyCorrectLights"

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >

    <!-- Camera -->

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>



    <!-- AR content -->

    <a-entity mindar-image-target="targetIndex: 0">

    <!-- 1. 雷射主要主幹光束 (Laser Beam - 傾斜貫穿光路) -->
  <a-cylinder
    position="0.05 0.10 0.25"
    rotation="-15 -25 75"
    radius="0.018"
    height="1.2"
    color="#00ff66"
    material="shader: flat; transparent: true; opacity: 0.85;"
    animation__pulse="
      property: material.opacity;
      from: 0.4;
      to: 1.0;
      dur: 800;
      loop: true;
      dir: alternate
    "
  >
  </a-cylinder>

  <!-- 2. 立方體腔體 Cubic Chamber (P1/P2 氣體區) -->
  <a-box
    position="0.20 0.18 0.25"
    rotation="10 -20 0"
    width="0.22"
    height="0.22"
    depth="0.22"
    color="#e6995c"
    material="transparent: true; opacity: 0.45;"
  >
  </a-box>

  <!-- 3. 微透鏡陣列 MLA (取代原本多餘的圓環) -->
  <a-plane
    position="0.38 0.23 0.26"
    rotation="0 -25 0"
    width="0.12"
    height="0.12"
    color="#cccccc"
    material="transparent: true; opacity: 0.7; side: double; wireframe: true;"
  >
  </a-plane>

  <!-- 4. CCD 感光相機 (接收端) -->
  <a-box
    position="0.48 0.26 0.26"
    rotation="0 -25 0"
    width="0.10"
    height="0.12"
    depth="0.12"
    color="#333333"
  >
  </a-box>

  <!-- 5. 說明文字：主標題 -->
  <a-text
    value="SEE GAS WITH LIGHT"
    position="0 0.55 0.30"
    align="center"
    color="#ffffff"
    width="2.8"
    animation="
      property: position;
      from: 0 0.45 0.30;
      to: 0 0.55 0.30;
      dur: 900;
      easing: easeOutQuad
    "
  >
  </a-text>

  <!-- 6. 標籤文字：Cubic Chamber -->
  <a-text
    value="Cubic Chamber"
    position="0.20 0.35 0.28"
    align="center"
    color="#ffcc99"
    width="1.6"
  >
  </a-text>

  <!-- 7. 標籤文字：CCD / MLA -->
  <a-text
    value="MLA + CCD"
    position="0.48 0.36 0.28"
    align="center"
    color="#66ffcc"
    width="1.5"
  >
  </a-text>

  <!-- 8. 副標題 -->
  <a-text
    value="即時檢測 | 非侵入式 | 無需光譜儀"
    position="0 -0.45 0.30"
    align="center"
    color="#66ffcc"
    width="1.8"
  >
  </a-text>
      

    </a-entity>

  </a-scene>

</body>

</html>
